name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run site audit
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/check-site.ps1 -RepositoryRoot .
